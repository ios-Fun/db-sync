# spring.jpa.database=my_database
server.port=9090

spring.kafka.bootstrap-servers=192.168.0.58:9094
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka 监听器使用的 topic 与 group-id（被 @KafkaListener 占位符引用）
kafka.topic.wal=your-wal-topic-name
kafka.consumer.group-id=your-consumer-group-id
kafka.consumer.concurrency=6

# ==================== WAL 文件摆渡配置（一区） ====================
# 定稿后的正式文件在其 ready 子目录（网闸源目录必须指向 .../wal-logs/ready）
wal.file.output-dir=./data/wal-logs
# WAL 文件时间窗口大小（毫秒），必须与三区 wal.window-ms 保持一致（5分钟）
wal.window-ms=300000
# 刷盘 / 窗口定稿检查间隔（毫秒）：窗口结束后最迟此时长内完成定稿，必须远小于三区 wal.completion-safety-ms(20000)
wal.file.flush-interval-ms=1000

