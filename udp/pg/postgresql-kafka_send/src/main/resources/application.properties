# spring.jpa.database=my_database
server.port=9090

spring.kafka.bootstrap-servers=192.168.0.58:9094
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka 监听器使用的 topic 与 group-id（被 @KafkaListener 占位符引用）
kafka.topic.wal=your-wal-topic-name
kafka.consumer.group-id=your-consumer-group-id
kafka.consumer.concurrency=6

# WAL 文件配置
wal.file.output-dir=./data/wal-logs  # 网闸同步的源目录

