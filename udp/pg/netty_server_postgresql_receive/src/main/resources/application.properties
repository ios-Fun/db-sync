spring.datasource.druid.driver-class-name=org.postgresql.Driver
spring.datasource.druid.url=jdbc:postgresql://localhost:5432/my_database?currentSchema=public
spring.datasource.druid.username=postgres
spring.datasource.druid.password=postgres
spring.datasource.druid.initial-size=1
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=5
spring.datasource.druid.max-wait=30

db.schema=public

# ==================== WAL 文件接收配置 ====================
# 网闸落盘目录（只读，应用不在此目录做写操作）
wal.receive.incoming-dir=/opt/cdc-receive/data/incoming
# 内部安全工作区（完全由应用控制）
wal.receive.work-dir=/opt/cdc-receive/data/work
# 已消费文件名注册表
wal.receive.consumed-registry=/opt/cdc-receive/data/.consumed_files
# 一区 WAL 文件时间窗口大小（毫秒），需与一区 WalFileWriter.WINDOW_MS(5分钟) 保持一致
wal.window-ms=300000
# 文件完成安全间隔（毫秒），当前时间超过窗口结束时间+此间隔才认为文件已写完
wal.completion-safety-ms=20000
